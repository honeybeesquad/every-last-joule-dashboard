name: Chile ERCOT CSV spike

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm exec tsx scripts/probe-chile-ercot.ts
      - name: Commit probe log
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/spikes/chile-ercot-csv-probe.md; then
            echo "Probe log unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spikes/chile-ercot-csv-probe.md
          git commit -m "docs: record Chile ERCOT CSV probe"
          git push origin v0-build
