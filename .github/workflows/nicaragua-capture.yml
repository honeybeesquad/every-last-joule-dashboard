name: Nicaragua CNDC capture

# CNDC Nicaragua's generation-by-type endpoint serves only the current
# Nicaragua-time day (UTC−6, no daylight saving) and takes no date parameter,
# so a day is lost unless it is read before local midnight. This captures the
# day at 23:40 local (05:40 UTC), merges its hourly SOLAR rows into
# data/historical/nicaragua-cndc-solar-hourly.csv, and lands the change the way
# history-append.yml does: a bot branch and an auto-merge PR, pushed with
# AUTOMATION_TOKEN so `verify` runs (GITHUB_TOKEN events do not trigger it).
#
# The 03:40 UTC run (21:40 local) is a safety net: if the late run fails, the
# day still has every daylight hour, which is all src/data/nicaragua.json.ts
# needs (00:00–19:00). A later capture of the same hour replaces an earlier one.

on:
  schedule:
    - cron: "40 3 * * *"
    - cron: "40 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: nicaragua-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture today's CNDC solar hours
        run: npx tsx scripts/capture/nicaragua-cndc.ts

      - name: Open / refresh auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/nicaragua-capture"
          FILE="data/historical/nicaragua-cndc-solar-hourly.csv"

          if git diff --quiet -- "$FILE"; then
            echo "No change to $FILE — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add "$FILE"
          git commit -m "chore(data): capture CNDC Nicaragua solar hours"
          git push --force origin "$BRANCH"

          state="$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || echo NONE)"
          if [ "$state" != "OPEN" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): capture CNDC Nicaragua solar hours" \
              --body "Automated nightly capture (\`.github/workflows/nicaragua-capture.yml\`). Auto-merges once \`verify\` passes."
          fi
          gh pr merge "$BRANCH" --auto --squash
