name: Relay pull (Colombia + India)

# Pulls daily CSVs from the private every-last-joule-data-relay repo
# (written by Britta cron) and commits them into data/historical/.
#
# Colombia: runs ~19:15 UTC daily (45 min after Britta's 18:30 UTC push window).
# India:    gen-re.cea.gov.in daily Excel; Britta fetches at 06:30 UTC; GA runs
#           after Colombia pull to pick up both in one build.
# Also triggerable manually.
#
# `main` is a protected branch with a required `verify` status check, so this
# workflow does NOT push to main directly.  It opens a PR from a bot branch and
# enables auto-merge, landing the CSVs once `verify` is green.  The push/PR uses
# AUTOMATION_TOKEN (a PAT or GitHub App token), because GitHub will not trigger
# `verify` for events raised by the default GITHUB_TOKEN.  RELAY_DEPLOY_KEY is a
# separate read-only deploy key used only to clone the private relay repo.

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:

jobs:
  pull-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4
        with:
          ref: main
          # PAT / App token so the resulting PR triggers the `verify` check.
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Fetch latest CSVs from relay repo
        env:
          RELAY_DEPLOY_KEY: ${{ secrets.RELAY_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null /tmp/relay_deploy_key
          echo "$RELAY_DEPLOY_KEY" > /tmp/relay_deploy_key

          GIT_SSH_COMMAND="ssh -i /tmp/relay_deploy_key -o StrictHostKeyChecking=no" \
            git clone --depth=1 \
              git@github.com:honeybeesquad/every-last-joule-data-relay.git \
              /tmp/relay

          rm /tmp/relay_deploy_key

          # Colombia
          cp /tmp/relay/colombia-vertimientos-daily.csv \
             data/historical/colombia-vertimientos-daily.csv

          # India (copy only if present in relay repo)
          for state in rajasthan gujarat tamil-nadu andhra-pradesh maharashtra; do
            src="/tmp/relay/india-${state}-gen-daily.csv"
            dst="data/historical/india-${state}-gen-daily.csv"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
            fi
          done

      - name: Open / refresh auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/relay-pull"

          git add data/historical/colombia-vertimientos-daily.csv \
                  data/historical/india-rajasthan-gen-daily.csv \
                  data/historical/india-gujarat-gen-daily.csv \
                  data/historical/india-tamil-nadu-gen-daily.csv \
                  data/historical/india-andhra-pradesh-gen-daily.csv \
                  data/historical/india-maharashtra-gen-daily.csv \
                  2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new rows — nothing to commit."
            exit 0
          fi

          ROWS_CO="$(wc -l < data/historical/colombia-vertimientos-daily.csv | tr -d ' ')"
          ROWS_IN="$(wc -l < data/historical/india-rajasthan-gen-daily.csv 2>/dev/null | tr -d ' ' || echo '?')"

          git config user.name  "elj-relay-bot"
          git config user.email "bot@everylastjoule.com"

          git switch -C "$BRANCH"
          git commit -m "chore(data): pull relay CSVs — Colombia ${ROWS_CO} rows, India ${ROWS_IN} rows"
          git push --force origin "$BRANCH"

          state="$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || echo NONE)"
          if [ "$state" != "OPEN" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): pull relay CSVs (Colombia + India)" \
              --body "Automated daily relay CSV pull. Auto-merges once \`verify\` passes."
          fi
          gh pr merge "$BRANCH" --auto --squash
