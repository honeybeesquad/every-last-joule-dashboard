name: Dashboard health check

# Runs every 6 hours on a schedule offset from the data-refresh cron.  Fetches
# the live dashboard's emitted region JSONs, counts freshness-degraded regions
# and zero-output live-tier regions, and opens a GitHub Issue when degradation crosses
# a threshold.  Zero cost: checks run against the public Vercel deployment,
# no local build required.
#
# Thresholds are conservative — small cached counts are normal (upstream
# hiccups, weekend-maintenance downtime), but sustained high counts usually
# indicate a real source change that needs a code patch.

on:
  schedule:
    - cron: "45 */6 * * *"   # offset from data-refresh 15-past schedule
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for issue template + source list)
        uses: actions/checkout@v4

      - name: Fetch deployed dashboard asset manifest
        id: manifest
        run: |
          set -euo pipefail
          html=$(curl -sS "https://everylastjoule.com/?cb=$(date +%s)" --max-time 30)
          # Extract all hashed data JSON URLs referenced by the current build.
          echo "$html" | grep -oE 'data/[a-z0-9-]+\.[a-f0-9]+\.json' | sort -u > /tmp/manifest.txt
          wc -l /tmp/manifest.txt
          head /tmp/manifest.txt

      - name: Inspect each region payload for degradation
        id: inspect
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request

          BASE = "https://everylastjoule.com/_file/"
          LIVE_TIERS = {
              "T1-live-TSO",
              "T1a-live-tso",
              "T1b-live-domestic-anchored",
              "T1c-live-neighbour-anchored",
          }
          KNOWN_ZERO_LIVE_ALLOWLIST = {
              "aemo-tas-solar",
              "brazil-maranhao-solar",
              "brazil-mg-wind",
              "brazil-sp-wind",
              "brazil-mt-wind",
              "brazil-mt-solar",
              "brazil-go-wind",
              "brazil-pr-wind",
              "brazil-pr-solar",
              "brazil-rs-solar",
              "brazil-other-solar",
              "serbia-solar",
              "bosnia-and-herzegovina",
              "north-macedonia-solar",
              "montenegro",
              "uruguay",
              "italy-north-zone-wind",
              "czech-republic-wind",
              "slovenia-wind",
              "slovakia-wind",
              "moldova-wind",
              "nyiso-rest-solar",
              # Japan (OCCTO eria_jukyu): curtailment is strongly seasonal —
              # spring peak, near-zero across the mid-year. These areas read ~0
              # every July-August and held issue #207 open for six weeks,
              # drowning two genuine faults (Germany creds, NZ hydro staleness).
              # TRADE-OFF: a real Japan loader break during the zero season will
              # not raise the zero-peak count. The freshness check still covers
              # it — a broken fetch degrades to cached and is counted there.
              "japan-chugoku",
              "japan-hokkaido-solar",
              "japan-hokkaido-wind",
              "japan-hokuriku",
              "japan-kansai",
              "japan-kyushu",
              "japan-okinawa",
              "japan-shikoku",
              "japan-tepco",
              "japan-tohoku-wind",
              # NZ ≤$0 nodal-price regions: nine months of EMI final pricing
              # (2025-10 → 2026-06) hit ≤$0 at these nodes on one day only, so a
              # zero here is the true reading of a live feed, not a breakage.
              "new-zealand-hydro",
              "new-zealand-solar",
          }

          def is_region_record(value):
              return (
                  isinstance(value, dict)
                  and isinstance(value.get("regionId"), str)
                  and isinstance(value.get("profile"), list)
              )

          def region_records(payload):
              if is_region_record(payload):
                  return [payload]
              if isinstance(payload, dict):
                  return [value for value in payload.values() if is_region_record(value)]
              return []

          def max_positive_value(record):
              values = []
              for key in ("profile", "latestProfile"):
                  arr = record.get(key)
                  if isinstance(arr, list):
                      values.extend(v for v in arr if isinstance(v, (int, float)))
              return max(values, default=0)

          def write_output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          def write_multiline(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}<<EOF\n{value}\nEOF\n")

          total = 0
          live = 0
          freshness = 0
          zero = 0
          degraded_list = []
          zero_list = []

          with open("/tmp/manifest.txt", encoding="utf-8") as fh:
              paths = [line.strip() for line in fh if line.strip()]

          for path in paths:
              try:
                  with urllib.request.urlopen(BASE + path, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except Exception as exc:
                  print(f"::warning::failed to fetch {path}: {exc}")
                  continue

              for record in region_records(payload):
                  total += 1
                  region_id = record["regionId"]
                  status = record.get("sourceStatus") or "live"
                  if status in {"cached", "degraded"}:
                      freshness += 1
                      degraded_list.append(f"- {region_id} ({status})")
                  else:
                      live += 1

                  tier = record.get("confidenceTier")
                  if (
                      tier in LIVE_TIERS
                      and region_id not in KNOWN_ZERO_LIVE_ALLOWLIST
                      and max_positive_value(record) < 0.001
                  ):
                      zero += 1
                      zero_list.append(f"- {region_id} ({tier}, peak GW ~0)")

          write_output("total", total)
          write_output("freshness", freshness)
          write_output("live", live)
          write_output("zero", zero)
          write_multiline("degraded", "\n".join(degraded_list))
          write_multiline("zeros", "\n".join(zero_list))

          print(f"::notice::checked {total} region records: fresh={live} freshness-degraded={freshness} zero-peak={zero}")
          PY

      - name: Ensure auto-health label exists
        if: fromJSON(steps.inspect.outputs.freshness) >= 10 || fromJSON(steps.inspect.outputs.zero) >= 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: succeed whether the label already exists or not.
          gh label create auto-health \
            --color "fbca04" \
            --description "Auto-generated health-check degradation issues" \
            2>/dev/null || true

      - name: Open GitHub Issue if degradation exceeds threshold
        if: fromJSON(steps.inspect.outputs.freshness) >= 10 || fromJSON(steps.inspect.outputs.zero) >= 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRESHNESS: ${{ steps.inspect.outputs.freshness }}
          ZERO: ${{ steps.inspect.outputs.zero }}
          TOTAL: ${{ steps.inspect.outputs.total }}
          LIVE: ${{ steps.inspect.outputs.live }}
          DEGRADED_LIST: ${{ steps.inspect.outputs.degraded }}
          ZERO_LIST: ${{ steps.inspect.outputs.zeros }}
        run: |
          title="[health] Dashboard degraded: ${FRESHNESS} freshness-degraded, ${ZERO} zero-peak (of ${TOTAL})"
          body=$(cat <<EOF
          Automated health-check run at $(date -u +"%Y-%m-%dT%H:%M:%SZ") flagged degradation on the live dashboard.

          **Summary:**
          - Total regions checked: ${TOTAL}
          - Fresh region records: ${LIVE}
          - Freshness-degraded records (cached or degraded): ${FRESHNESS}
          - Zero-peak output: ${ZERO}

          **Freshness-degraded regions (withFallback served last-good):**

          ${DEGRADED_LIST}

          **Zero-peak regions (possible loader breakage):**

          ${ZERO_LIST}

          **Likely causes:**
          1. Upstream source URL changed (common for ENTSO-E psrType codes, ONS Brazil filename patterns)
          2. TSO page behind new CAPTCHA / Cloudflare challenge
          3. API quota exhaustion (EIA 5000 req/hr)
          4. Network event during the last rebuild

          **Action:** review failing loader logs in the most recent Vercel deployment, then patch the relevant \`src/data/<region>.json.ts\`. Automated self-repair is future work; manual review is the current expectation for these alerts.

          This issue will be auto-closed when a subsequent health-check run shows freshness-degraded < 10 and zero < 5.
          EOF
          )

          # Close any existing open health issues if the current run is green — handled above via threshold
          # Otherwise create a new issue (dedup by checking if there's already an open one from this workflow)
          existing=$(gh issue list --label "auto-health" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing auto-health issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "auto-health"
          fi

      - name: Auto-close stale health issues when healthy
        if: fromJSON(steps.inspect.outputs.freshness) < 10 && fromJSON(steps.inspect.outputs.zero) < 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh issue list --label "auto-health" --state open --json number --jq '.[].number')
          for n in $open; do
            gh issue close "$n" --comment "Auto-closed: health metrics back within threshold (freshness-degraded < 10, zero < 5)."
          done
