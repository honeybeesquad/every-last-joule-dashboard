name: Historical snapshot append

# Appends the current committed snapshots to a rolling Parquet file so that
# researchers can download a full time-series archive with stable schema.
#
# Runs daily at 02:00 UTC (after the 01:15 refresh build has settled) and
# after every successful data-refresh workflow.  Each run fetches the
# deployed dashboard's current region payloads (https://everylastjoule.com
# by default, overridable via ELJ_DASHBOARD_URL), builds a flat row per
# region, and appends it to data/historical/curtailment_history.parquet.
# Before 2026-08-19 this workflow read the repository's committed
# data/snapshots/last-good/*.json fallback corpus instead — see the
# capture_source column and dataset/SCHEMA.md § "Parquet rolling history"
# for the resulting discontinuity in the archive.
#
# Schema (one row per region per build) — see scripts/append_history.py's
# module docstring and dataset/SCHEMA.md for the full column list,
# including confidence_tier, uncertainty_low_gw/high_gw, and
# capture_source.
#   build_timestamp  — ISO-8601 UTC (string, sortable)
#   region_id        — string
#   peak_gw          — float32
#   total_twh_30d    — float32
#   source_status    — "live" | "cached" | null
#   last_updated     — string (YYYY or YYYY-Q# or ISO timestamp)
#   profile_h00 … profile_h23  — float32, one column per UTC hour
#
# The Parquet file uses Snappy compression.  `main` is a protected branch with
# a required `verify` status check, so this workflow does NOT push to main
# directly — it opens a PR from a bot branch and enables auto-merge, which lands
# the row once `verify` is green.  The push/PR is made with AUTOMATION_TOKEN (a
# PAT or GitHub App token) rather than the default GITHUB_TOKEN, because GitHub
# deliberately will not trigger `verify` for events raised by GITHUB_TOKEN.
#
# At ~75 regions × ~100 bytes per row × 365 days ≈ 2.7 MB/yr — tiny.  DuckDB or
# pandas can read it directly.
#
# Example usage:
#   import pandas as pd
#   df = pd.read_parquet("https://raw.githubusercontent.com/honeybeesquad/
#       every-last-joule-dashboard/main/data/historical/
#       curtailment_history.parquet")
#   df.query("region_id == 'caiso'").plot(x="build_timestamp", y="peak_gw")

on:
  workflow_run:
    workflows: ["Scheduled data refresh"]
    types: [completed]
  schedule:
    # Daily safety net at 02:00 UTC — catches any missed workflow_run events.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  append:
    runs-on: ubuntu-latest
    # Only run after a successful refresh (or on manual / cron trigger).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history not needed — just the current files.
          fetch-depth: 1
          # PAT / App token so the resulting PR triggers the `verify` check.
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Append snapshot row to Parquet
        run: python scripts/append_history.py

      - name: Open / refresh auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/history-snapshot"
          FILE="data/historical/curtailment_history.parquet"

          if git diff --quiet -- "$FILE"; then
            echo "No change to $FILE — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add "$FILE"
          git commit -m "chore(history): append daily snapshot"
          git push --force origin "$BRANCH"

          state="$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || echo NONE)"
          if [ "$state" != "OPEN" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(history): append daily snapshot" \
              --body "Automated daily history append. Auto-merges once \`verify\` passes."
          fi
          gh pr merge "$BRANCH" --auto --squash
