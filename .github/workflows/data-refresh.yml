name: Scheduled data refresh

# Triggers a Vercel rebuild on a fixed schedule, then waits for it to go live.
# Vercel's build environment already has EIA_API_KEY and ENTSOE_API_TOKEN
# configured as Project Environment Variables, so each rebuild re-runs every
# data loader and captures the freshest numbers before redeploying.  Loaders
# run ~8-wide via scripts/build/prefetch-loaders.ts with a 3-minute per-loader
# deadline, so a build is bounded by the slowest loader (~4-5 min), not the
# sum (16 min serial, and 46-min failures when an upstream stalled —
# 2026-09-10).
#
# A 201 from the hook only means Vercel queued a deployment, not that it
# built one. From 2026-09-24 to 27 scripts/build/vercel-ignore.sh skipped
# every hook build, and this job reported success each time while production
# served the 24 Sep build. So the job now waits for a fresh build to go live
# and FAILS when none does (scripts/ci/check-deploy-freshness.ts wait). A red
# run here means production did not refresh. history-append.yml runs only
# after a green run, so it captures the new build rather than the old one.
#
# The alarm is Healthchecks.io, because GitHub's scheduler is what fails most
# often: it ran 2 to 6 of these 8 slots a day in September 2026, hours late.
# Each run pings the check in repo secret HC_PING_URL: /start first, then
# success only once the new build is live and passes the freshness check (at
# least 100 live regions), otherwise /fail. Healthchecks emails at once on a
# /fail, and when no success ping arrives within the check's period plus
# grace, so a refresh that never runs is caught too
# (scripts/ci/ping-healthchecks.sh).
#
# The Deploy Hook URL is stored as repo secret VERCEL_DEPLOY_HOOK.  It is a
# POST-only URL; anyone with it can trigger a rebuild.  Rotate via the
# Vercel dashboard if it leaks.

on:
  schedule:
    # Every 3 hours at :15 past the hour — spaced off the common :00 cron
    # spike and timed so daily-publisher regions (ONS Brazil, NREA Egypt,
    # etc.) have their latest files available.  At ~5 build-minutes per
    # deploy × 8 deploys/day = ~40 min/day, well under Hobby's 100 hr/mo.
    # GitHub runs scheduled jobs late and drops some: 3 to 5 of the 8 ran
    # per day on 24–27 Sep 2026. Healthchecks.io alarms when no good refresh
    # lands in time (see above); deploy-freshness.yml at 26 h.
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

# A refresh that is still waiting for its build must not overlap the next.
concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  # vercel-ignore.sh reads a head younger than this as a fresh push and may
  # skip it. Keep in step with window_min in scripts/build/vercel-ignore.sh.
  PUSH_WINDOW_MIN: 15

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    # Worst case: install (~2 min), three 16-min waits for main's head to age,
    # the 30-min wait for the build, then up to 5 min to check it: about
    # 85 min. At 60, GitHub could cancel the job before the wait step fails
    # with its explanation.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tell Healthchecks.io a refresh has started
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: bash scripts/ci/ping-healthchecks.sh start

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Let a just-merged commit age past the push window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If an automation commit merged moments ago, Vercel would read this
          # hook's build as that commit's push and could skip it. Wait until
          # main's head is older than the window. Bounded, and it never blocks
          # the refresh: anything unreadable just proceeds to the hook.
          # It checks again after every wait, so a commit that lands during
          # one is seen; at most three waits, then the hook goes anyway and the
          # next step reports a skipped build.
          need=$(( (PUSH_WINDOW_MIN + 1) * 60 ))
          for attempt in 1 2 3 4; do
            committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.committer.date 2>/dev/null) || break
            committed_s=$(date -d "$committed" +%s 2>/dev/null) || break
            age=$(( $(date +%s) - committed_s ))
            if [ "$age" -ge "$need" ]; then break; fi
            if [ "$attempt" -eq 4 ]; then
              echo "::warning::main's head is still ${age}s old after three waits; Vercel may skip this hook's build as a push."
              break
            fi
            pause=$(( need - age > need ? need : need - age ))
            echo "main's head is ${age}s old; waiting ${pause}s"
            sleep "$pause"
          done
          exit 0

      - name: POST Vercel deploy hook
        id: hook
        run: |
          set -euo pipefail
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          response=$(curl -sS -X POST "$VERCEL_DEPLOY_HOOK" \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            --max-time 30)
          echo "$response"
          status=$(printf '%s\n' "$response" | awk -F= '/^HTTP_STATUS=/{print $2}')
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "Deploy hook returned non-success status: $status" >&2
            exit 1
          fi
          echo "Vercel accepted the deploy hook."
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Wait for the new build to go live
        id: wait
        env:
          HOOK_AT: ${{ steps.hook.outputs.at }}
        run: npx tsx scripts/ci/check-deploy-freshness.ts wait --after "$HOOK_AT" --timeout-min 30

      - name: Check the new build's data
        id: quality
        # The new build is live by now; this asks whether it is any good: at
        # least 100 live regions, and the live regions' median lastSuccessAt
        # under 26 h. A bad or missing answer fails the Healthchecks ping
        # below, not this job, so history-append.yml still captures what
        # production now serves. It normally takes seconds.
        continue-on-error: true
        timeout-minutes: 5
        run: npx tsx scripts/ci/check-deploy-freshness.ts check --report "$RUNNER_TEMP/freshness.md"

      - name: Tell Healthchecks.io how the refresh went
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
          HOOK: ${{ steps.hook.outcome }}
          WAIT: ${{ steps.wait.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          STALE: ${{ steps.quality.outputs.stale }}
          TITLE: ${{ steps.quality.outputs.title }}
          REPORT: ${{ runner.temp }}/freshness.md
        run: bash scripts/ci/ping-healthchecks.sh outcome
