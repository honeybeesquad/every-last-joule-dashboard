name: Scheduled data refresh

# Triggers a Vercel rebuild on a fixed schedule.  Vercel's build environment
# already has EIA_API_KEY and ENTSOE_API_TOKEN configured as Project
# Environment Variables, so each rebuild re-runs every data loader and
# captures the freshest numbers before redeploying.  Each build takes ~3
# minutes and our Hobby-tier budget easily supports the cadence below.
#
# The Deploy Hook URL is stored as repo secret VERCEL_DEPLOY_HOOK.  It is a
# POST-only URL; anyone with it can trigger a rebuild.  Rotate via the
# Vercel dashboard if it leaks.

on:
  schedule:
    # Every 3 hours at :15 past the hour — spaced off the common :00 cron
    # spike and timed so daily-publisher regions (ONS Brazil, NREA Egypt,
    # etc.) have their latest files available.  At ~3 build-minutes per
    # deploy × 8 deploys/day = ~24 min/day, well under Hobby's 100 hr/mo.
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: POST Vercel deploy hook
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST "$VERCEL_DEPLOY_HOOK" \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            --max-time 30)
          echo "$response"
          status=$(printf '%s\n' "$response" | awk -F= '/^HTTP_STATUS=/{print $2}')
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "Deploy hook returned non-success status: $status" >&2
            exit 1
          fi
          echo "Vercel rebuild triggered."
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
