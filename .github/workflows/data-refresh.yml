name: Scheduled data refresh

# Builds production on Vercel and puts it live, on a fixed schedule and on
# every push to main that changes the site, then checks the new build. The
# name stays "Scheduled data refresh": history-append.yml's workflow_run
# trigger names it.
#
# Since step 3b of docs/superpowers/plans/2026-09-28-refresh-pipeline.md
# (29 Sep 2026) the job deploys with the Vercel CLI (`vercel deploy --prod`).
# The build still runs on Vercel, where the production API keys live: every
# one is a "sensitive" variable that Vercel never hands back, so the build
# cannot move into Actions. The CLI waits for the build and returns its result
# and log to this run. Vercel's own git builds for main are off (vercel.json,
# git.deploymentEnabled), so production changes only through this workflow;
# pull-request previews still build on Vercel as before. Each build re-runs
# every data loader the site reads, ~8-wide via scripts/build/prefetch-loaders.ts with a
# 3-minute per-loader deadline, so it is bounded by the slowest loader.
#
# Before step 3b a deploy hook asked Vercel for a build and the job had to
# infer the result: from 2026-09-24 to 27 scripts/build/vercel-ignore.sh
# skipped every hook build while the job reported success (STATUS.md,
# "Scheduled rebuilds were being skipped"). A CLI deployment carries no .git,
# so the ignore step cannot skip it (trial run 36501200671).
#
# After the deploy the job confirms from outside, as a visitor sees it, that
# production serves a build made after this run started deploying, then
# checks that build's data (scripts/ci/check-deploy-freshness.ts).
# history-append.yml runs only after a green run, so it captures the new
# build.
#
# The alarm is Healthchecks.io, because GitHub's scheduler is what fails most
# often: it ran 2 to 6 of these 8 slots a day in September 2026, hours late.
# Each run pings the check in repo secret HC_PING_URL: /start first, then
# success only once the new build is live and passes the freshness check (at
# least 100 live regions), otherwise /fail. Healthchecks emails at once on a
# /fail, and when no success ping arrives within the check's period plus
# grace, so a refresh that never runs is caught too
# (scripts/ci/ping-healthchecks.sh).
#
# Repo secret VERCEL_TOKEN is the one credential every production deploy
# depends on, code merges included. It can deploy and change every project in
# its Vercel team, so rotate it in Vercel (Account Settings, Tokens) if it
# leaks, and before it expires. A missing, expired or revoked token fails the
# deploy step, and the /fail ping says so.
#
# Rollback: revert the step 3b pull request. That restores the deploy hook
# step and Vercel's git builds for main; repo secret VERCEL_DEPLOY_HOOK stays
# until step 4 removes it.

on:
  schedule:
    # Every 3 hours at :15 past the hour — spaced off the common :00 cron
    # spike and timed so daily-publisher regions (ONS Brazil, NREA Egypt,
    # etc.) have their latest files available.  At ~7 build-minutes per
    # deploy × 8 deploys/day, well under Hobby's 100 hr/mo.
    # GitHub runs scheduled jobs late and drops some: 3 to 5 of the 8 ran
    # per day on 24–27 Sep 2026. Healthchecks.io alarms when no good refresh
    # lands in time (see above); abed's refresh clock fills the gaps
    # (docs/ops/abed-refresh-clock.md); deploy-freshness.yml alarms at 26 h.
    - cron: "15 */3 * * *"
  workflow_dispatch: {}
  # Code merges go live through this workflow now that Vercel's git builds for
  # main are off. The kinds of push the Vercel ignore step left for the next
  # refresh (scripts/build/vercel-ignore.sh, as #1153 left it) still wait:
  # ones that change only data/historical (the history captures and relay
  # CSVs the automation commits, and other build inputs kept there),
  # data/snapshots (the last-good fallback corpus), docs, or Markdown at the
  # repo root. Deploying on the automation's pushes would also loop: refresh,
  # history capture, push, refresh. docs/validation is the one part of docs/
  # the build reads (the region pages embed it), and pages under src/ are site
  # content, so both deploy. One difference: the ignore step compared a push
  # with the last successful deployment, so a docs-only push after a failed
  # deploy built the failed change too; this filter sees only the push, so
  # that change waits for the next refresh. GitHub's `paths-ignore` cannot
  # take a path back, so this is an ordered `paths` list: a later pattern
  # overrides an earlier one, and `*` stops at `/`, so "!*.md" drops Markdown
  # at the repo root only.
  push:
    branches: [main]
    paths:
      - "**"
      - "!data/historical/**"
      - "!data/snapshots/**"
      - "!docs/**"
      - "docs/validation/**"
      - "!*.md"

# One deploy at a time: a refresh or a merge that is still deploying must not
# overlap the next. GitHub keeps one pending run per group, the newest, so a
# burst of pushes deploys once after the current run, not once each. A pending
# run that is replaced never starts, so it sends no ping. The group names the
# ref, so a run started by hand on another branch, which the job's `if`
# skips, cannot replace a pending run for main.
concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

env:
  # Which Vercel team and project to deploy: identifiers, not credentials.
  VERCEL_ORG_ID: team_dChOGCQaLAx3BjIpDs33mFFf
  VERCEL_PROJECT_ID: prj_khErTAybZwU4g3lPTnnTDztoKJz4

jobs:
  deploy:
    # Production is main. A run started by hand on another branch would
    # otherwise put that branch live, with a success ping and a history
    # capture.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Every step has its own time limit, so a hang fails that step and the
    # Healthchecks ping says where: before the deploy, in it, or in the wait.
    # The job's limit sits well above their sum, which
    # tests/data-refresh-workflow.test.ts checks, leaving room for job set-up
    # and the post steps, so it is only a backstop. A cancelled job, by hand
    # or by that backstop, also sends /fail.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # main's head when the job starts, not the commit that triggered the
      # run: a re-run of an old run, or a run that waited its turn, must not
      # put an older main back live.
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: main

      - name: Tell Healthchecks.io a refresh has started
        timeout-minutes: 2
        # The alarm must never stop or fail a refresh.
        continue-on-error: true
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: bash scripts/ci/ping-healthchecks.sh start

      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: "24"
          cache: npm

      # Before the deploy, so a registry failure stops the run before
      # production changes. The CLI never uploads node_modules (or .git): both
      # are on its built-in ignore list.
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      - name: Install the Vercel CLI
        timeout-minutes: 5
        run: npm install --global vercel@60.1.3

      - name: Build and deploy production on Vercel
        id: deploy
        # Hobby builds one deployment at a time, so this can queue behind a
        # pull request's preview build; the build itself took 6 to 7 min in
        # the step 3a trials.
        timeout-minutes: 35
        env:
          # The CLI reads the token from the environment; it is never a flag.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is not set."
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # --force: a refresh must rebuild even when main has not changed,
          # or Vercel may hand back the previous deployment of the same files
          # and no loader runs; --with-cache keeps the build cache a git build
          # restores. The deployment URL goes to stdout; the build log (--logs)
          # to stderr. The build stamp takes the commit and branch from the
          # two build variables when Vercel sets no VERCEL_GIT_* variables, as
          # for a CLI deployment it may not (src/data/build-info.json.ts).
          url=$(vercel deploy --prod --force --with-cache --logs --yes \
            --build-env "ELJ_BUILD_COMMIT=$commit" \
            --build-env "ELJ_BUILD_REF=main" | tail -n 1)
          case "$url" in
            https://*) ;;
            *) echo "::error::vercel deploy printed no deployment URL"; exit 1 ;;
          esac
          echo "Production deployment: $url"

      - name: Confirm production serves the new build
        id: wait
        # The CLI returns once the deployment is live, so this normally passes
        # on its first poll. 10 min of polling, plus its last poll's fetches
        # and sleep.
        timeout-minutes: 13
        env:
          DEPLOY_AT: ${{ steps.deploy.outputs.at }}
        run: npx tsx scripts/ci/check-deploy-freshness.ts wait --after "$DEPLOY_AT" --timeout-min 10

      - name: Check the new build's data
        id: quality
        # The new build is live by now; this asks whether it is any good: at
        # least 100 live regions, and the live regions' median lastSuccessAt
        # under 26 h. A bad or missing answer fails the Healthchecks ping
        # below, not this job, so history-append.yml still captures what
        # production now serves. It normally takes seconds. Its worst case is
        # about 15 min: the page, the build stamp, then about 143 data files
        # 8 at a time, each read up to 43 s with its retry.
        continue-on-error: true
        timeout-minutes: 20
        run: npx tsx scripts/ci/check-deploy-freshness.ts check --report "$RUNNER_TEMP/freshness.md"

      - name: Tell Healthchecks.io how the refresh went
        if: always()
        timeout-minutes: 2
        # A red job here would stop history-append.yml capturing a good build.
        continue-on-error: true
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY: ${{ steps.deploy.outcome }}
          WAIT: ${{ steps.wait.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          STALE: ${{ steps.quality.outputs.stale }}
          TITLE: ${{ steps.quality.outputs.title }}
          REPORT: ${{ runner.temp }}/freshness.md
        run: bash scripts/ci/ping-healthchecks.sh outcome
