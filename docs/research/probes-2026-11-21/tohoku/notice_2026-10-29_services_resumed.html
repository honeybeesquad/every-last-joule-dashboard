<div class="title00"><h1>東北電力ネットワークからのお知らせ</h1></div>

<div id="mainConteiner">
<h2 class="titleL01"><span class="is-date">



























2026年10月29日</span>システムメンテナンス終了に伴うサービスの再開について</h2>




<p>当社ホームページで提供している一部サービスについて、セキュリティ確保のため一時停止しておりましたが（<a href="https://nw.tohoku-epco.co.jp/information/1249258_2390.html" target="_blank">10月22日</a>、<a href="https://nw.tohoku-epco.co.jp/information/1249295_2390.html" target="_blank">10月27日</a> お知らせ済み）、システムメンテナンスが終了したことから、10月28日よりサービスを再開いたしました。</p>
<p>なお、現時点において、不正アクセスやお客さま情報の漏えい等の事実は確認されておりません。</p>
<p>お客さまには、サービス停止期間中、ご不便とご迷惑をおかけしましたことを深くお詫び申し上げます。</p>
