<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Every Last Joule — The live ledger for Bitcoin's energy.</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0A0A0A;
    --surface: #141414;
    --surface-2: #1A1A1A;
    --line: #222222;
    --line-soft: #2c2c2c;
    --text: #F2F2F0;
    --muted: rgba(242,242,240,0.62);
    --dim: rgba(242,242,240,0.42);
    --accent: #D4FF3A;
    --cool: #7AA6FF;
    --hot: #FF5447;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); }
  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'Geist Mono', monospace; }
  .serif { font-family: 'Newsreader', serif; }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  .accent { color: var(--accent); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 13px; font-weight: 600;
    letter-spacing: -0.005em;
    transition: transform .12s ease, background .12s ease, color .12s ease;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill.primary { background: var(--accent); color: var(--ink); }
  .pill.primary:hover { background: #E2FF66; }
  .pill.outline { border: 1.5px solid var(--text); color: var(--text); padding: 10.5px 22px; }
  .pill.outline:hover { background: var(--text); color: var(--ink); }
  .pill.ghost { color: var(--text); }
  .pill:active { transform: translateY(1px); }

  /* Live dot */
  .live-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  /* Animated bar reveal */
  @keyframes barfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  /* Ticker */
  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .ticker-track { animation: ticker 60s linear infinite; }

  /* Nav */
  nav.top {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav.top .row {
    display: flex; justify-content: space-between; align-items: center;
    height: 64px;
  }
  nav.top .links {
    display: flex; gap: 28px; font-size: 13.5px; font-weight: 500; color: var(--muted);
  }
  nav.top .links a:hover { color: var(--text); }

  h1, h2, h3 { margin: 0; letter-spacing: -0.035em; }

  /* Section spacing */
  section { padding: 96px 0; border-bottom: 1px solid var(--line); }
  section.no-rule { border-bottom: 0; }

  /* Stat cards */
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat-card .v {
    font-family: 'Geist Mono', monospace;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  /* Article cards */
  .note-card {
    display: grid; grid-template-columns: 96px 1fr 130px;
    gap: 28px; align-items: center;
    padding: 22px 0;
    border-top: 1px solid var(--line);
    transition: padding .15s ease;
    cursor: pointer;
  }
  .note-card:last-child { border-bottom: 1px solid var(--line); }
  .note-card:hover { padding-left: 8px; }
  .note-card:hover .arrow { color: var(--accent); transform: translateX(4px); }
  .arrow { font-family: 'Geist Mono', monospace; color: var(--dim); transition: color .12s ease, transform .12s ease; text-align: right; }

  /* Range slider */
  input[type="range"].joule {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: transparent; cursor: pointer;
  }
  input[type="range"].joule::-webkit-slider-runnable-track {
    height: 4px; background: var(--line-soft); border-radius: 999px;
  }
  input[type="range"].joule::-moz-range-track {
    height: 4px; background: var(--line-soft); border-radius: 999px;
  }
  input[type="range"].joule::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 999px;
    background: var(--accent); margin-top: -6px;
    box-shadow: 0 0 0 4px rgba(212,255,58,0.18);
  }
  input[type="range"].joule::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 999px;
    background: var(--accent); border: 0;
    box-shadow: 0 0 0 4px rgba(212,255,58,0.18);
  }

  /* Input */
  input[type="email"].sub {
    background: transparent;
    border: 0; border-bottom: 1.5px solid var(--line-soft);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    font-size: 16px;
    padding: 14px 4px;
    width: 100%;
    outline: none;
  }
  input[type="email"].sub:focus { border-bottom-color: var(--accent); }
  input[type="email"].sub::placeholder { color: var(--dim); }

  /* Tabs */
  .tab {
    font-family: 'Geist Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 11px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease;
  }
  .tab.active { color: var(--ink); background: var(--accent); border-color: var(--accent); }
  .tab:not(.active):hover { color: var(--text); border-color: var(--line-soft); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

        <h1 style={{
          fontFamily: 'Inter Tight',
          fontWeight: 800,
          fontSize: 'clamp(96px, 14vw, 220px)',
          lineHeight: 0.86,

          marginTop: 28,
        }}>
          Every<br/>
          <span style={{ display: 'inline-flex', alignItems: 'baseline', gap: 'clamp(16px, 1.6vw, 28px)' }}>
            Last
            <span style={{ display: 'inline-block', width: 'clamp(140px, 18vw, 280px)', height: 'clamp(8px, 0.9vw, 14px)', background: 'var(--accent)', transform: 'translateY(-0.32em)', borderRadius: 2 }} />

          <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end', alignItems: 'center' }}>

// ============================================================
// Live stat strip
// ============================================================
function StatStrip() {

// ============================================================
// Manifesto / Intro
// ============================================================
function Manifesto() {
  return (
    <section>
      <div className="container">
        <div style={{ display: 'grid', gridTemplateColumns: '0.5fr 1fr', gap: 48 }}>
          <div className="eyebrow">What it is</div>
          <div>
            <div style={{ fontFamily: 'Newsreader', fontWeight: 400, fontStyle: 'italic', fontSize: 48, lineHeight: 1.15, letterSpacing: '-0.02em', textWrap: 'pretty' }}>
              For most of the industrial age, the constraint on energy was production. The grid is now constrained by something else — and Bitcoin happens to be the first load on Earth that fits the new shape.
            </div>
            <div style={{ marginTop: 36, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 36, fontSize: 15, lineHeight: 1.65, color: 'var(--muted)' }}>
              <p style={{ margin: 0 }}>
                Every Last Joule is a live database and a forthcoming book. The database tracks every megawatt-hour the Bitcoin network spends, where on Earth it came from, and what it cost the atmosphere. The book argues that those joules are not a bug. They are the point.
              </p>
              <p style={{ margin: 0 }}>
                A megawatt-hour stranded at a Texas wellhead is, in every meaningful sense, worthless. Mine bitcoin with it, and the same joule walks off the grid as a savings account. That is the entire trick — and what the rest of this site is for.
              </p>
            </div>
          </div>
        </div>
      </div>

// ============================================================
// The dataset — interactive
// ============================================================
function Dataset() {
  const [tab, setTab] = useState('joules');
  const [year, setYear] = useState(2026);

  const series = useMemo(() => {
    // Faux time series — monthly values 2019-01 .. 2026-05
    const months = [];
    const start = new Date(2019, 0, 1);
    const end = new Date(year, 4, 1);
    let d = new Date(start);
    while (d <= end) {
      months.push(new Date(d));
      d.setMonth(d.getMonth() + 1);
    }
    return months.map((m, i) => {
      const t = i / Math.max(months.length - 1, 1);
      const base = tab === 'joules' ? Math.pow(t, 1.3) * 100 + Math.sin(i / 3) * 4
                : tab === 'carbon' ? 600 - t * 220 + Math.sin(i / 4) * 18
                : tab === 'flared' ? Math.pow(t, 1.6) * 1.6 + Math.sin(i / 5) * 0.1
                : Math.pow(t, 0.7) * 700 + Math.sin(i / 3) * 15;
      return { m, v: Math.max(0, base) };
    });
  }, [tab, year]);

  const max = Math.max(...series.map(s => s.v));
  const path = series.map((s, i) => {
    const x = (i / (series.length - 1)) * 1000;
    const y = 280 - (s.v / max) * 240;
    return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  const area = path + ` L 1000 280 L 0 280 Z`;

  const latest = series[series.length - 1].v;
  const first = series[0].v;
  const delta = ((latest - first) / Math.max(first, 0.001)) * 100;

  const tabs = [
    { id: 'joules',  label: 'Joules spent',      unit: 'EJ/yr',   c: 'var(--accent)' },
    { id: 'carbon',  label: 'Grid carbon',       unit: 'g/kWh',   c: 'var(--cool)'   },
    { id: 'flared',  label: 'Flared-gas share',  unit: '%',       c: 'var(--accent)' },
    { id: 'hashrate', label: 'Hashrate',         unit: 'EH/s',    c: 'var(--accent)' },
  ];
  const current = tabs.find(t => t.id === tab);

  return (
    <section id="dataset">
      <div className="container">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 24 }}>
          <div>
            <div className="eyebrow">The dataset</div>
            <h2 style={{ fontFamily: 'Inter Tight', fontWeight: 700, fontSize: 68, lineHeight: 0.95, letterSpacing: '-0.04em', marginTop: 12 }}>
              Every joule, <span className="serif" style={{ fontStyle: 'italic', fontWeight: 500, color: 'var(--accent)' }}>accounted for</span>.
            </h2>
          </div>
          <div className="mono" style={{ fontSize: 12, color: 'var(--muted)', textAlign: 'right' }}>
            <div>Sources · Cambridge CCAF, EIA, ENTSO-E</div>
            <div style={{ marginTop: 4 }}>Methodology v2.4 · CC-BY-4.0</div>
          </div>
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 32, flexWrap: 'wrap' }}>
          {tabs.map(t => (
            <button key={t.id} className={`tab ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>

        {/* Chart panel */}
        <div style={{
          marginTop: 24,
          background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
          padding: '28px 32px 32px',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 16 }}>
            <div>
              <div className="eyebrow">{current.label}</div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 8 }}>
                <div className="mono" style={{ fontSize: 56, fontWeight: 500, color: current.c, letterSpacing: '-0.03em', lineHeight: 1 }}>
                  {latest.toFixed(tab === 'flared' ? 2 : 1)}
                </div>
                <div className="mono" style={{ fontSize: 14, color: 'var(--muted)' }}>{current.unit}</div>
              </div>
              <div className="mono" style={{ fontSize: 12, color: 'var(--muted)', marginTop: 6 }}>
                {delta > 0 ? '▲' : '▼'} {Math.abs(delta).toFixed(1)}% · 2019–{year}
              </div>
            </div>
            <div style={{ width: 260 }}>
              <div className="eyebrow" style={{ marginBottom: 14 }}>Through {year}</div>
              <input
                type="range"
                className="joule"
                min={2020}
                max={2026}
                value={year}
                onChange={e => setYear(parseInt(e.target.value))}
              />
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8 }}>
                <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>2020</span>
                <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>2026</span>
              </div>
            </div>
          </div>

          <svg viewBox="0 0 1000 280" style={{ width: '100%', height: 280, marginTop: 24, display: 'block' }}>
            <defs>
              <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor={current.c.replace('var(--accent)', '#D4FF3A').replace('var(--cool)', '#7AA6FF')} stopOpacity="0.32" />
                <stop offset="100%" stopColor={current.c.replace('var(--accent)', '#D4FF3A').replace('var(--cool)', '#7AA6FF')} stopOpacity="0" />
              </linearGradient>
            </defs>
            {[0, 1, 2, 3, 4].map(i => (
              <line key={i} x1="0" x2="1000" y1={40 + i * 60} y2={40 + i * 60} stroke="rgba(255,255,255,0.05)" />
            ))}
            <path d={area} fill="url(#fill)" />
            <path d={path} fill="none" stroke={current.c.replace('var(--accent)', '#D4FF3A').replace('var(--cool)', '#7AA6FF')} strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round" />
            <circle cx="1000" cy={280 - (latest / max) * 240} r="5" fill={current.c.replace('var(--accent)', '#D4FF3A').replace('var(--cool)', '#7AA6FF')} />
          </svg>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 24, marginTop: 28, paddingTop: 24, borderTop: '1px solid var(--line-soft)' }}>
            {[
              ['Coverage',   '157', 'countries'],
              ['Sites',      '3,412', 'mining facilities'],
              ['Updated',    '00:42', 'ago'],
              ['Open data',  'CSV · JSON · API', ''],
            ].map(([k, v, u], i) => (
              <div key={i}>
                <div className="eyebrow">{k}</div>
                <div className="mono" style={{ fontSize: 22, marginTop: 6, letterSpacing: '-0.02em' }}>{v}</div>
                {u && <div className="mono" style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>{u}</div>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

// ============================================================
// Field notes
// ============================================================
function FieldNotes() {

    ['013', 'Apr 28, 2026', 'What a Texas wellhead sounds like', '8 min', 'Field'],
    ['012', 'Apr 14, 2026', 'Bhutan, hydro, and the quiet country that out-mined Argentina', '11 min', 'Field'],

    ['010', 'Mar 16, 2026', 'The grid wants what the grid wants', '7 min', 'Method'],
    ['009', 'Mar 02, 2026', 'Stranded power, in seven landscapes', '14 min', 'Field'],
  ];
  return (
    <section id="notes">
      <div className="container">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div className="eyebrow">Field notes</div>
            <h2 style={{ fontFamily: 'Inter Tight', fontWeight: 700, fontSize: 68, lineHeight: 0.95, letterSpacing: '-0.04em', marginTop: 12 }}>
              Reporting from <br/>
              <span className="serif" style={{ fontStyle: 'italic', fontWeight: 500 }}>the grid edge</span>.
